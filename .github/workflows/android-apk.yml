name: Mobile release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.0"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          TWILIO_VERIFY_URL: ${{ secrets.TWILIO_VERIFY_URL }}
        run: flutter build apk --release --no-shrink --dart-define=TWILIO_VERIFY_URL=${TWILIO_VERIFY_URL:-https://zeppay.onrender.com}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeppay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable web
        run: flutter config --enable-web

      - name: Build Android web app
        env:
          TWILIO_VERIFY_URL: ${{ secrets.TWILIO_VERIFY_URL }}
        run: |
          flutter build web --release --pwa-strategy=offline-first \
            --base-href /zeppay/ \
            --dart-define=TWILIO_VERIFY_URL=${TWILIO_VERIFY_URL:-https://zeppay.onrender.com}

      - name: Upload Android web artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeppay-pwa
          path: build/web
          if-no-files-found: error

  ios-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zeppay-pwa/package-lock.json

      - name: Install and build iOS website
        working-directory: zeppay-pwa
        run: |
          npm ci
          npm run build

      - name: Upload iOS website artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeppay-ios-web
          path: zeppay-pwa/dist
          if-no-files-found: error

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pwa, ios-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android web
        uses: actions/download-artifact@v4
        with:
          name: zeppay-pwa
          path: site

      - name: Download iOS website
        uses: actions/download-artifact@v4
        with:
          name: zeppay-ios-web
          path: site/ios

      - name: Copy Zep Card web fallback
        run: cp -r gh-pages-root/zeppay site/

      - name: Publish GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          force_orphan: true

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [apk, pwa, ios-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: zeppay-apk
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Zep Pay ${{ github.run_number }}
          body: |
            **Android APK:** download `app-release.apk` → allow unknown sources → install.

            **iPhone (website, not Flutter PWA):**
            https://mananbharti.github.io/zeppay/ios/
            Safari → Share → **Add to Home Screen**

            **Android browser:** https://mananbharti.github.io/zeppay/

            Jio: 123PAY IVR on Android APK · UPI app on iPhone.

            OTP: live Twilio if configured, otherwise **123456**.
          files: |
            dist/app-release.apk
          make_latest: true
